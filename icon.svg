      <stop offset="1" stop-color="#0a1622"/>
    </radialGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4dfa2"/>
      <stop offset="0.45" stop-color="#d4af5f"/>
      <stop offset="1" stop-color="#a5823a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="205" r="150" fill="#c9a961" opacity="0.13"/>
  <g stroke="#0d1b2a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
