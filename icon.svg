    <line x1="202" y1="145" x2="146" y2="199"/>
    <line x1="310" y1="145" x2="366" y2="199"/>
    <line x1="146" y1="199" x2="256" y2="323"/>
    <line x1="366" y1="199" x2="256" y2="323"/>
    <line x1="202" y1="145" x2="256" y2="323"/>
    <line x1="310" y1="145" x2="256" y2="323"/>
